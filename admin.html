<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | UNDERWEARjanan</title><style>@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#f5f1e9;color:#222;font-family:Vazirmatn,Tahoma}header{background:#171714;color:white;padding:18px 5%;display:flex;justify-content:space-between}main{max-width:1100px;margin:28px auto;padding:0 16px}.card{background:white;padding:22px;margin:15px 0;border:1px solid #e3ddd3}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;font-size:12px;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;font:inherit}button{padding:11px 17px;background:#171714;color:white;border:0;cursor:pointer;margin:8px 0 0 5px}.secondary{background:#eee;color:#222}.danger{background:#963b32}.msg{font-size:13px;color:#963b32}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab.active{background:#8b765e}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:right}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}table{font-size:11px}}</style><style>:root{color-scheme:dark}html,body{background:radial-gradient(ellipse at top,#641731,#240715 60%,#100409)!important;color:#f7e4d8!important}
header{background:linear-gradient(90deg,#18040d,#6b1838,#18040d)!important;color:#f7dfce!important;border-bottom:1px solid #bd8a70}
.card{background:linear-gradient(145deg,#3b0c22,#200611)!important;color:#f7e4d8!important;border:1px solid #a87569!important;box-shadow:0 12px 30px #09020788}
input,select,textarea{background:#280a17!important;color:#f8e8df!important;border:1px solid #a96f68!important}
input::placeholder,textarea::placeholder{color:#bd9b90}
button{background:linear-gradient(135deg,#b34d70,#dfad8d)!important;color:#2b0717!important;border:1px solid #efcdb3!important;border-radius:9px}
button.secondary{background:#451027!important;color:#f5d9c7!important;border:1px solid #ad806f!important}
button.danger{background:#7b2638!important;color:#fff0e5!important}
.tab.active{background:#e0b08f!important;color:#2b0717!important}
table{color:#f7e4d8!important}td,th{border-color:#754153!important}th{color:#f2cdb3}
.msg{color:#ffaaaa!important}</style></head><body><header><b>UNDERWEARjanan — مدیریت فروشگاه</b><a href="/" style="color:white">مشاهده فروشگاه</a></header><main><section class="card" id="login"><h2>ورود مدیر</h2><p>برای ورود، رمز مدیریتی تنظیم‌شده روی سرور را وارد کن.</p><input id="password" type="password" placeholder="رمز مدیریت"><button id="loginBtn">ورود</button><div class="msg" id="loginMsg"></div></section><section id="dashboard" class="hidden"><div class="tabs"><button class="tab active" data-tab="products">محصولات</button><button class="tab" data-tab="orders">سفارش‌ها</button><button id="logout" class="secondary">خروج</button></div><div id="productsTab" class="card"><h2>ثبت / ویرایش محصول</h2><input type="hidden" id="pid"><div class="grid"><div><label>کد محصول</label><input id="code"></div><div><label>نام محصول</label><input id="name"></div><div><label>دسته‌بندی</label><select id="category"><option>زنانه</option><option>مردانه</option><option>ست</option></select></div><div><label>قیمت (تومان)</label><input id="price" type="number"></div><div><label>قیمت قبل از تخفیف (اختیاری)</label><input id="oldPrice" type="number"></div><div><label>موجودی کل</label><input id="stock" type="number"></div><div><label>رنگ‌ها (با ویرگول جدا کن)</label><input id="colors" placeholder="مشکی، سفید، کرم"></div><div><label>سایزها (با ویرگول جدا کن)</label><input id="sizes" placeholder="S، M، L، XL"></div><div><label>لینک عکس‌ها (هر خط یک لینک)</label><textarea id="images" rows="3"></textarea></div><div><label>جنس پارچه</label><input id="material"></div><div><label>نشان جدید</label><select id="isNew"><option value="false">خیر</option><option value="true">بله</option></select></div><div><label>توضیحات</label><textarea id="description" rows="3"></textarea></div></div><button id="saveProduct">ذخیره محصول</button><button id="clearForm" class="secondary">پاک‌کردن فرم</button><div id="productMsg" class="msg"></div><h3>فهرست محصولات</h3><div id="productList"></div></div><div id="ordersTab" class="card hidden"><h2>مدیریت سفارش‌ها</h2><div id="orderList"></div></div></section></main><script>
let token='',products=[];const $=id=>document.getElementById(id),api=async(path,opts={})=>{let r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...opts.headers}}),d=await r.json();if(!r.ok)throw Error(d.error||'خطا');return d};
$('loginBtn').onclick=async()=>{try{let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');loadProducts()}catch(e){$('loginMsg').textContent=e.message}};
function formData(){return {code:$('code').value,name:$('name').value,category:$('category').value,price:Number($('price').value),oldPrice:Number($('oldPrice').value)||0,stock:Number($('stock').value)||0,colors:$('colors').value.split(/[,،]/).map(x=>x.trim()).filter(Boolean),sizes:$('sizes').value.split(/[,،]/).map(x=>x.trim()).filter(Boolean),images:$('images').value.split('\n').map(x=>x.trim()).filter(Boolean),material:$('material').value,description:$('description').value,isNew:$('isNew').value==='true'}};
$('saveProduct').onclick=async()=>{try{let p=formData(),id=$('pid').value;await api(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',body:JSON.stringify(p)});$('productMsg').textContent='محصول ذخیره شد.';clearForm();loadProducts()}catch(e){$('productMsg').textContent=e.message}};
function clearForm(){['pid','code','name','price','oldPrice','stock','colors','sizes','images','material','description'].forEach(x=>$(x).value='');$('isNew').value='false'}$('clearForm').onclick=clearForm;
async function loadProducts(){try{let d=await api('/api/admin/products');products=d.products;$('productList').innerHTML=products.length?'<table><tr><th>کد</th><th>نام</th><th>دسته</th><th>قیمت</th><th>موجودی</th><th>عملیات</th></tr>'+products.map(p=>'<tr><td>'+p.code+'</td><td>'+p.name+'</td><td>'+p.category+'</td><td>'+p.price.toLocaleString('fa-IR')+'</td><td>'+p.stock+'</td><td><button data-edit="'+p.id+'">ویرایش</button><button class="danger" data-delete="'+p.id+'">حذف</button></td></tr>').join('')+'</table>':'هنوز محصولی ثبت نشده است.';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(products.find(p=>p.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('محصول حذف شود؟')){await api('/api/admin/products/'+b.dataset.delete,{method:'DELETE'});loadProducts()}})}catch(e){$('productMsg').textContent=e.message}}
function edit(p){$('pid').value=p.id;['code','name','category','price','oldPrice','stock','material','description'].forEach(k=>$(k).value=p[k]??'');$('colors').value=(p.colors||[]).join('، ');$('sizes').value=(p.sizes||[]).join('، ');$('images').value=(p.images||[]).join('\n');$('isNew').value=String(!!p.isNew);window.scrollTo({top:0,behavior:'smooth'})}
async function loadOrders(){try{let d=await api('/api/admin/orders');$('orderList').innerHTML=d.orders.length?'<table><tr><th>شماره</th><th>مشتری</th><th>تلفن</th><th>مبلغ</th><th>وضعیت</th><th>ذخیره</th></tr>'+d.orders.map(o=>'<tr><td>'+o.id+'</td><td>'+o.customer.name+'</td><td>'+o.customer.phone+'</td><td>'+o.total.toLocaleString('fa-IR')+'</td><td><select id="st-'+o.id+'">'+['در انتظار بررسی','تأیید شده','در حال آماده‌سازی','ارسال شده','تحویل شده','لغو شده'].map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><button data-status="'+o.id+'">ثبت</button></td></tr>').join('')+'</table>':'سفارشی ثبت نشده است.';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{await api('/api/admin/orders/'+b.dataset.status,{method:'PATCH',body:JSON.stringify({status:$('st-'+b.dataset.status).value})});loadOrders()})}catch(e){$('orderList').textContent=e.message}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('productsTab').classList.toggle('hidden',b.dataset.tab!=='products');$('ordersTab').classList.toggle('hidden',b.dataset.tab!=='orders');if(b.dataset.tab==='orders')loadOrders()});$('logout').onclick=()=>{token='';$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')};
</script></body></html>
